<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchuBase — Sign In</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <h1>SchuBase</h1>
      <p class="login-sub">Auto Pilot for your courses</p>
      <form id="login-form" action="/auth/login" method="POST">
        <input class="login-input" type="password" name="password" placeholder="Enter access password" required autofocus>
        <button class="login-btn" type="submit">Sign In</button>
      </form>
      <p class="login-error" id="login-error">Incorrect password. Try again.</p>
      <p class="login-footer">Secured access only.</p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('login-error').style.display = 'block';
    }
  </script>
</body>
</html>
