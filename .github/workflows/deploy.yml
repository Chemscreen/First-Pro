name: Deploy SchuBase to Render

on:
  push:
    branches: [main, claude/auto-research-blackboard-e38bX]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deploy triggered!"
          else
            echo "No RENDER_DEPLOY_HOOK secret set. Skipping auto-deploy."
            echo ""
            echo "To enable auto-deploy:"
            echo "1. Go to https://render.com and create a Web Service"
            echo "2. Get the Deploy Hook URL from Settings > Deploy Hook"
            echo "3. Add it as a GitHub secret: RENDER_DEPLOY_HOOK"
          fi
